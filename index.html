<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Я рядом // 2017</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 45%,#6b355d,#171026 65%,#090713);color:#fff;font-family:Impact,'Arial Narrow',sans-serif;overflow:hidden}body:after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#0004 4px);opacity:.5}.sun{position:absolute;width:60vmin;height:60vmin;border-radius:50%;background:linear-gradient(#ffc1da,#9e4b91);left:50%;top:45%;transform:translate(-50%,-50%);filter:blur(4px);opacity:.5;box-shadow:0 0 100px #f8a3c5}.label{position:absolute;top:25px;left:25px;font:12px monospace;letter-spacing:3px;color:#ffc1db}.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px}.scene h1{font-size:clamp(42px,10vw,130px);line-height:1.05;text-transform:uppercase;max-width:1000px;transform:rotate(-3deg);text-shadow:5px 5px #7c397c,0 0 35px #ff9fce;animation:pop .45s ease-out}.scene small{font:12px monospace;letter-spacing:4px;color:#ffc5e0}@keyframes pop{from{opacity:0;filter:blur(15px);transform:translateY(30px) rotate(-3deg)}to{opacity:1;filter:blur(0);transform:rotate(-3deg)}}footer{position:absolute;bottom:25px;left:20px;right:20px;display:flex;gap:12px;align-items:center;font:12px monospace;z-index:5}button{background:#ffb2d6;border:0;padding:13px 22px;color:#1b0a1a;font-weight:bold;cursor:pointer}input{flex:1;accent-color:#ffb2d6}#intro{position:absolute;inset:0;background:#0e0a19ed;z-index:8;display:grid;place-content:center;text-align:center;gap:20px;padding:25px}#intro strong{font-size:clamp(65px,15vw,170px);line-height:.8;text-shadow:7px 7px #9d477f}#intro p{font:12px monospace;line-height:1.8;color:#eab4d0}#intro button{font-size:18px}@keyframes shake{0%,100%{transform:translate(0,0) rotate(-3deg)}20%{transform:translate(-7px,3px) rotate(-5deg)}40%{transform:translate(6px,-5px) rotate(1deg)}60%{transform:translate(-3px,5px) rotate(-4deg)}}@keyframes zoom{0%{transform:scale(1.3);filter:blur(20px)}100%{transform:scale(1);filter:blur(0)}}@keyframes glitch{0%,100%{clip-path:inset(0)}20%{clip-path:inset(20% 0 55% 0);transform:translate(10px,-3px)}40%{clip-path:inset(60% 0 10% 0);transform:translate(-12px,4px)}60%{clip-path:inset(0);transform:translate(0)}}.scene h1{position:relative;will-change:transform,filter;transition:color .1s}.scene h1.hit{animation:zoom .2s steps(2),shake .27s steps(3)!important}.scene h1.hit:after{content:attr(data-text);position:absolute;inset:0;color:#ff367f;mix-blend-mode:screen;opacity:.65;animation:glitch .3s steps(3);pointer-events:none}.scene h1.hit:before{content:attr(data-text);position:absolute;inset:0;color:#49ffff;mix-blend-mode:screen;opacity:.55;transform:translate(-5px,2px);pointer-events:none}.beatflash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}.beatflash.on{animation:strobe .23s steps(2)}@keyframes strobe{0%{opacity:.45}100%{opacity:0}}.sun{animation:sunpulse .48s ease-in-out infinite alternate}@keyframes sunpulse{to{transform:translate(-50%,-50%) scale(1.06);filter:blur(8px) hue-rotate(18deg)}}.scene small{z-index:2}body{transition:background .15s}body.drop{background:radial-gradient(circle at 50% 45%,#ab265b,#27122e 65%,#07030c)}@media(prefers-reduced-motion:reduce){.scene h1.hit,.scene h1.hit:after,.sun,.beatflash.on{animation:none!important}} </style><div class="sun"></div><div class="beatflash" id="beatflash"></div><div class="label">● REC 2017 / STILL HERE</div><div class="scene"><small id="num">MEMORY 01 / 09</small><h1 id="line">ДАЖЕ ЕСЛИ ВЕСЬ МИР ПРОТИВ НАС</h1><small>LOST SUMMER // VHS EDIT</small></div><footer><button id="play">▶</button><span id="time">00:00</span><input type="range" id="seek" min="0" max="31" step=".1" value="0"><button id="again">↺</button></footer><div id="intro"><strong>STILL<br>HERE ♡</strong><p>2017 // ВОСПОМИНАНИЯ<br>НАЖМИ, ЧТОБЫ НАЧАТЬ</p><button id="start">▶ PLAY</button></div><audio id="audio" src="./chorus.mp3" preload="metadata"></audio><script>const a=document.getElementById('audio'),l=document.getElementById('line'),s=document.getElementById('seek'),t=document.getElementById('time'),n=document.getElementById('num'),intro=document.getElementById('intro'),play=document.getElementById('play');const cues=[[0,'ДАЖЕ ЕСЛИ ВЕСЬ МИР ПРОТИВ НАС'],[3.9,'Я БУДУ РЯДОМ'],[7.8,'ТВОИ УЛЫБКИ В ПАМЯТИ'],[10,'ОСКОЛКИ ГЛАЗ'],[12,'ПОСЛЕДСТВИЕ ЯДА'],[15.6,'У ПОДНОЖИЯ ЛЕТА МЫ ЖДЁМ ОТВЕТОВ'],[19.5,'КОТОРЫХ НЕТУ'],[23.4,'ПОТОРОПИЛИСЬ БРОСИВ ВСЁ'],[27.3,'ЗАДУМАЛИСЬ... ЗАБЫЛИСЬ...']];let last=-1;function tick(){let i=0;for(let j=0;j<cues.length;j++)if(a.currentTime>=cues[j][0])i=j;if(i!==last){last=i;l.textContent=cues[i][1];l.dataset.text=cues[i][1];document.body.classList.toggle("drop",i%2===1);l.style.animation='none';void l.offsetWidth;l.style.animation='pop .45s ease-out';n.textContent='MEMORY '+String(i+1).padStart(2,'0')+' / 09'}s.value=a.currentTime;t.textContent='00:'+String(Math.floor(a.currentTime)).padStart(2,'0');play.textContent=a.paused?'▶':'Ⅱ'}function start(){intro.style.display='none';a.play().catch(()=>{intro.style.display='grid';document.getElementById('start').textContent='ЗАГРУЗИ chorus.mp3'})}document.getElementById('start').onclick=start;play.onclick=()=>a.paused?start():a.pause();document.getElementById('again').onclick=()=>{a.currentTime=0;start()};s.oninput=()=>{a.currentTime=+s.value;tick()};let lastBeat=-1;function pulse(){if(!a.paused){const beat=Math.floor(a.currentTime/.49);if(beat!==lastBeat){lastBeat=beat;l.classList.remove('hit');void l.offsetWidth;l.classList.add('hit');const f=document.getElementById('beatflash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}}requestAnimationFrame(pulse)}requestAnimationFrame(pulse);a.ontimeupdate=tick;a.onpause=tick;a.onplay=tick;a.onended=()=>intro.style.display='grid';tick();</script></html>
